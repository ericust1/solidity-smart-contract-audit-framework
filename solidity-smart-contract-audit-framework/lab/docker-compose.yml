version: "3.8"

networks:
  defi-lab:
    driver: bridge

services:
  eth-node:
    image: ethereum/client-go:alltools-latest
    container_name: eth-node
    command: --dev --http --http.addr 0.0.0.0 --http.port 8545 --http.api eth,web3,net,debug
    ports:
      - "8545:8545"
      - "8546:8546"
    networks:
      - defi-lab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 10

  slither:
    image: trailofbits/eth-security-toolbox
    container_name: slither-toolbox
    depends_on:
      - eth-node
    volumes:
      - ../contracts:/contracts
      - ../reports:/reports
      - ../src:/src
    working_dir: /workspace
    networks:
      - defi-lab
    entrypoint: ["tail", "-f", "/dev/null"]

  mythril:
    image: trailofbits/eth-security-toolbox
    container_name: mythril-toolbox
    depends_on:
      - eth-node
    volumes:
      - ../contracts:/contracts
      - ../reports:/reports
    working_dir: /workspace
    networks:
      - defi-lab
    entrypoint: ["tail", "-f", "/dev/null"]
